[project]
name = "skills"
version = "3.1.1"
description = "Zenable skills and integrations for AI coding agents"
authors = [
    { name = "Zenable", email = "support@zenable.io" }
]
keywords = ["zenable", "guardrails", "policy-as-code", "conformance", "mcp", "governance", "quality", "security", "specifications", "spec-driven development", "context engineering"]
dependencies = []
readme = "README.md"
requires-python = ">= 3.13"

[project.urls]
Homepage = "https://zenable.io"
Documentation = "https://docs.zenable.io"
Repository = "https://github.com/Zenable-io/skills"

[tool.uv]
managed = true

# The assessment skill's report tooling ships its own tests. They run through an
# ephemeral `uv run --with pytest` (see Taskfile) so the repo keeps zero locked
# dependencies; this block only registers the markers those tests use.
[tool.pytest.ini_options]
markers = [
    "unit: fast, isolated test with no external dependencies",
    "integration: exercises real files, subprocesses, or tools",
]

[tool.uv.pip]
universal = true
generate-hashes = true
require-hashes = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# Releases run only via workflow_dispatch of the Release workflow. The current
# version is derived from git tags (tag_format); semantic-release writes the new
# version into the files below, commits that bump together with the changelog as
# `chore(release): {version}`, pushes it to main, and tags that commit — so the
# tag, the GitHub release, and the in-repo manifests always agree. Claude Code
# reads the plugin version from the two manifests, not from git tags, which is
# why they must be written as part of the release rather than by hand.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    ".claude-plugin/marketplace.json:version",
    "plugins/z/.claude-plugin/plugin.json:version",
    "plugins/z/plugin.json:version",
]
commit_message = "chore(release): {version}"
branch = "main"
commit_parser = "angular"
tag_format = "v{version}"
major_on_zero = true
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
# Pushes use GH_TOKEN, which the Release workflow sets to a token minted for
# the internal release app the branch ruleset's bypass list exempts (the
# default GITHUB_TOKEN would be rejected as github-actions[bot]).
ignore_token_for_push = false

[tool.semantic_release.publish]
dist_glob_patterns = []
upload_to_vcs_release = false
